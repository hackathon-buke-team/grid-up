# PANO GÖZ — on-prem dağıtım (Public Cloud YOK). Sertleştirme notları: docs/13-DAGITIM-SERTLESTIRME.md
#
# DURUM: bu dosya Docker olmayan bir makinede yazıldı, `docker compose up` ile ÇALIŞTIRILMADI.
# tests/test_deploy.py yalnız değişmezleri (kullanıcı, yetenekler, ağlar, sağlık kontrolleri...) doğrular.
#
# İlk kurulum:   python -m tools.gen_certs --out deploy/certs --devices TC-0001 IRPD-0001 GW-0001
#                docker compose up -d --build
name: panogoz

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    user: "1883:1883"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    ports:
      - "8883:8883"           # yalnız karşılıklı TLS (saha düğümleri); düz metin 1883 YOK
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./deploy/certs/mosquitto.crt:/mosquitto/certs/mosquitto.crt:ro
      - ./deploy/certs/mosquitto.key:/mosquitto/certs/mosquitto.key:ro
      - ./deploy/certs/panogoz-health.crt:/mosquitto/certs/panogoz-health.crt:ro
      - ./deploy/certs/panogoz-health.key:/mosquitto/certs/panogoz-health.key:ro
      - mosquitto-data:/mosquitto/data
    networks: [backend, ingest]
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "8883",
             "--cafile", "/mosquitto/certs/ca.crt",
             "--cert", "/mosquitto/certs/panogoz-health.crt", "--key", "/mosquitto/certs/panogoz-health.key",
             "-i", "health-probe", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "4"]
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 10s

  panogoz:
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
    ports:
      # SCADA protokolleri yalnızca SCADA arayüzüne bağlanır (varsayılan: yalnız bu makine)
      - "${SCADA_BIND_ADDR:-127.0.0.1}:5020:5020"
      - "${SCADA_BIND_ADDR:-127.0.0.1}:2404:2404"
    volumes:
      - ./deploy/certs/ca.crt:/certs/ca.crt:ro
      - ./deploy/certs/panogoz-server.crt:/certs/panogoz-server.crt:ro
      - ./deploy/certs/panogoz-server.key:/certs/panogoz-server.key:ro
    networks: [backend, scada]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 40s

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    depends_on:
      panogoz:
        condition: service_healthy
    ports:
      - "443:8443"            # operatör konsolu: TLS + istemci sertifikası zorunlu
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/certs/ca.crt:/certs/ca.crt:ro
      - ./deploy/certs/proxy.crt:/certs/proxy.crt:ro
      - ./deploy/certs/proxy.key:/certs/proxy.key:ro
    networks: [backend, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true            # broker <-> uygulama <-> proxy: dış dünyaya çıkış yok
  ingest: {}                  # saha düğümlerinin broker'a mTLS ile bağlandığı ağ
  scada: {}                   # SCADA/RTU arayüzü
  edge: {}                    # operatör erişimi (yalnız proxy)

volumes:
  mosquitto-data: {}
