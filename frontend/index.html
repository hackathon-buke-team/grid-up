<!doctype html>
<!--
  PANO GÖZ · Pano/hücre içi anomali erken uyarı sistemi
  ADM & GDZ Elektrik "Grid Up" · TEDAŞ 1600 kVA AG dağıtım panosu

  SIFIR BAĞIMLILIK. npm yok, paketleyici yok, CDN yok, çerçeve yok.
  Yalnızca düz ES modülleri, elle yazılmış SVG ve Canvas.

  Bu bir kısıt değil, satış argümanıdır: bir dağıtım şirketinin trafo merkezi
  sunucusu internete çıkmaz. Bu arayüz bir USB bellekten kopyalanıp hava
  boşluklu (air-gapped) bir makinede açıldığında, dış dünyadan tek bir bayt
  istemeden tam olarak çalışır. Tedarik zinciri yüzeyi de aynı sebeple sıfırdır:
  denetlenecek üçüncü taraf paket yoktur.

  Yazı tipi sistem yazı tipidir (web fontu = ağ isteği). Sayılar
  font-variant-numeric ile tablo hizalıdır. Metin tr-TR'dir: ondalık virgül,
  binlik nokta, gg.AA.yyyy, Europe/Istanbul. Türkçe metinde CSS ile büyük harfe
  çevirme YOKTUR - "i" harfini "I" yapar, "İ" yapmaz.

  Renk erişilebilirliği: her seviye rengi bir ŞEKİL ve bir Türkçe ETİKETLE
  birlikte kullanılır. Ölçüm ısı haritaları cividis rampasıdır (algısal olarak
  düzgün, renk körlüğüne dayanıklı); gökkuşağı rampası hiçbir yerde yoktur.
  Saf kırmızı/yeşil yalnızca topolojiye ayrılmıştır.
-->
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="PANO GÖZ · AG dağıtım panosu içi anomali erken uyarı sistemi">
  <title>PANO GÖZ · Pano içi anomali erken uyarı</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e141c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2356b9ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffea46'/%3E%3C/svg%3E">
  <!-- Tema, ilk boyamadan ÖNCE kurulur: modül betiği beklenirse açık temayı
       seçmiş bir kullanıcı bir kare boyunca koyu ekran görür ve bu göz alır.
       Aynı mantığın kalıcı kopyası js/theme.js içindedir. -->
  <script>
    try {
      var t = localStorage.getItem('panogoz.tema');
      document.documentElement.setAttribute('data-tema', t === 'acik' ? 'acik' : 'koyu');
    } catch (e) { document.documentElement.setAttribute('data-tema', 'koyu'); }
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app">
    <div id="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="6" fill="#0e141c" stroke="#2a3a4e"></rect>
        <circle cx="16" cy="16" r="8" fill="none" stroke="#56b9ff" stroke-width="2.4"></circle>
        <circle cx="16" cy="16" r="2.8" fill="#ffea46"></circle>
        <path d="M4 16h4M24 16h4M16 4v4M16 24v4" stroke="#2a3a4e" stroke-width="2"
              stroke-linecap="round"></path>
      </svg>
      <div class="name">PANO GÖZ<small>θ erken uyarı</small></div>
    </div>

    <header id="head"></header>
    <nav id="rail" aria-label="Ekranlar"></nav>
    <main id="main">
      <div class="empty"><div class="big">Yükleniyor…</div></div>
    </main>
  </div>

  <aside id="drawer" aria-label="Senaryo çekmecesi">
    <header>
      <h2>Demo senaryoları</h2>
      <span class="sp" style="flex:1 1 auto"></span>
      <button class="btn sm" id="drawer-close" type="button">kapat</button>
    </header>
    <div class="body"></div>
  </aside>

  <div id="toasts" aria-live="polite"></div>

  <noscript>
    <div class="empty">
      <div class="big">Bu arayüz JavaScript gerektirir.</div>
      <div class="small">Ham veri her zaman <code>/api/fleet</code> ve
        <code>/api/panel/&lt;pano&gt;</code> adreslerinden JSON olarak, register haritası ise
        Modbus TCP üzerinden okunabilir. Arayüz katmanı tek erişim yolu değildir.</div>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
