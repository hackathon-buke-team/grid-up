<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PANO GÖZ · Final Sunumu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e141c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%234aa3ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffea46'/%3E%3C/svg%3E">
<!--
  PANO GÖZ · ADM & GDZ Elektrik · Grid Up Hackathon final sunumu.
  Bu dosya sunum/build.py tarafından üretilir; elle düzenlemeyin, sunum/src/ altını düzenleyin.
  Tek dosya, bağımlılık yok, internet gerekmez.
  Tuşlar: → / ← ilerle-geri · N konuşma metni · S konuşmacı ekranı · O slayt haritası
          Q jüri soruları · F tam ekran · B karart · P metni yazdır · R slaytı yeniden oynat
          sayı + Enter: o slayta git
-->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#06080c; --bg2:#0a0e14; --panel:#0e131b; --panel2:#121a25;
  --line:#1c2632; --line2:#2a3746;
  --ink:#e9eef4; --muted:#93a0b2; --dim:#5f6c7e;
  --brand:#f78320; --brand2:#ffb066; --brand-soft:rgba(247,131,32,.14);
  --olcum:#ffea46;
  --bilgi:#9dabbd; --izle:#4aa3ff; --uyari:#f4b13a; --kritik:#ff6b3d; --acil:#ff2f79; --ok:#35c07a;
  --l1:#a3abb5; --l2:#3a3f47; --l3:#9a6440; --nn:#7cc4ff;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --sans:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;display:grid;place-items:center}
.slide{
  position:absolute;width:1280px;height:720px;padding:46px 60px 40px;
  background:
    radial-gradient(1000px 560px at 100% -8%, rgba(247,131,32,.09), transparent 62%),
    radial-gradient(800px 480px at -8% 108%, rgba(74,163,255,.07), transparent 62%),
    linear-gradient(160deg,#0b1018 0%,#06080c 100%);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 120px rgba(0,0,0,.7);
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .35s ease, transform .35s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
.slide::before{ /* teknik çizim ızgarası */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(900px 520px at 70% 40%,#000 20%,transparent 80%);
          mask-image:radial-gradient(900px 520px at 70% 40%,#000 20%,transparent 80%);
}
.slide.active{opacity:1;pointer-events:auto;transform:scale(1)}
.slide>*{position:relative}

/* köşe: dağıtım şirketi logoları + alt bilgi */
.cnr{position:absolute!important;top:30px;right:40px;display:flex;align-items:center;gap:12px;opacity:.9}
.cnr img{height:20px;display:block}
.cnr i{width:1px;height:18px;background:var(--line2)}
.foot{position:absolute!important;left:60px;bottom:16px;font:500 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.foot svg{width:13px;height:13px}
.pgno{position:absolute!important;right:60px;bottom:16px;font:500 11px/1 var(--mono);color:var(--dim);letter-spacing:.06em}

/* tipografi */
.kicker{font:600 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin:0 0 12px}
h1{font:700 64px/1.02 var(--sans);margin:0 0 14px;letter-spacing:-.03em}
h2{font:700 36px/1.1 var(--sans);margin:0 0 6px;letter-spacing:-.022em;max-width:30ch}
h3{font:600 16px/1.3 var(--sans);margin:0 0 4px}
.lead{font:400 18px/1.5 var(--sans);color:var(--muted);margin:0;max-width:64ch}
.sub{font:400 14px/1.5 var(--sans);color:var(--dim);margin:0}
.mono{font-family:var(--mono)}
.brand{color:var(--brand)} .ok{color:var(--ok)} .izle{color:var(--izle)} .uyari{color:var(--uyari)}
.kritik{color:var(--kritik)} .acil{color:var(--acil)} .olcum{color:var(--olcum)} .muted{color:var(--muted)} .dimc{color:var(--dim)}
b,strong{font-weight:650}

/* yerleşim */
.hd{margin-bottom:8px;padding-right:260px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.row{display:flex;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.grow{flex:1;min-height:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.center{display:grid;place-items:center}

.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:0}
.card.tight{padding:11px 14px}
.card .cap{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.kpi .v{font:700 34px/1 var(--sans);letter-spacing:-.02em}
.kpi .l{font:500 13px/1.35 var(--sans);color:var(--muted);margin-top:6px}
.kpi .d{font:600 12px/1 var(--mono);margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font:600 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.chip.ok{color:var(--ok);border-color:rgba(53,192,122,.35);background:rgba(53,192,122,.08)}
.chip.brand{color:var(--brand);border-color:rgba(247,131,32,.4);background:var(--brand-soft)}
.chip.kritik{color:var(--kritik);border-color:rgba(255,107,61,.4);background:rgba(255,107,61,.1)}
.chip.uyari{color:var(--uyari);border-color:rgba(244,177,58,.4);background:rgba(244,177,58,.09)}
.chip.izle{color:var(--izle);border-color:rgba(74,163,255,.4);background:rgba(74,163,255,.09)}
.chip.acil{color:var(--acil);border-color:rgba(255,47,121,.4);background:rgba(255,47,121,.1)}
.formula{font:500 30px/1.2 var(--mono);color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.formula .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em}
.formula .frac>span:first-child{border-bottom:2px solid var(--muted);padding:0 .25em .08em}
.formula .frac>span:last-child{padding-top:.08em}
svg text{font-family:var(--sans)}
svg .mono{font-family:var(--mono)}

/* tarayıcı çerçevesi (ekran görüntüleri) */
.frame{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#0c1014;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.frame .bar{height:28px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#121820;border-bottom:1px solid var(--line)}
.frame .bar i{width:9px;height:9px;border-radius:50%;background:#2a3542}
.frame .bar span{margin-left:12px;font:500 11px/1 var(--mono);color:var(--dim)}
.frame .scr{position:relative;overflow:hidden;aspect-ratio:16/10}
.frame .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left;opacity:0;transition:opacity .6s ease}
.frame .scr img.on{opacity:1;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.0)}to{transform:scale(1.045)}}

/* ------------------------------------------------------------------ */
/* Animasyon sistemi: [data-a] öğeleri .go gelince oynar.              */
/* Adım öğeleri [data-step] → ile açılır.                              */
/* ------------------------------------------------------------------ */
[data-a]{opacity:0}
[data-a].go{animation-duration:.75s;animation-timing-function:var(--ease);animation-fill-mode:both;animation-delay:var(--d,0s)}
[data-a="fade"].go{animation-name:a-fade}
[data-a="up"].go{animation-name:a-up}
[data-a="down"].go{animation-name:a-down}
[data-a="left"].go{animation-name:a-left}
[data-a="right"].go{animation-name:a-right}
[data-a="pop"].go{animation-name:a-pop;animation-duration:.6s}
[data-a="grow-x"].go{animation-name:a-growx;transform-origin:left center}
[data-a="grow-y"].go{animation-name:a-growy;transform-origin:center bottom;transform-box:fill-box}
[data-a="draw"]{opacity:1;stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000)}
[data-a="draw"].go{animation-name:a-draw;animation-duration:var(--dur,1.6s);animation-timing-function:ease-in-out}
[data-a="blur"].go{animation-name:a-blur;animation-duration:.9s}
@keyframes a-fade{from{opacity:0}to{opacity:1}}
@keyframes a-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes a-down{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes a-left{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes a-right{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes a-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes a-growx{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes a-growy{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes a-draw{from{stroke-dashoffset:var(--len,2000)}to{stroke-dashoffset:0}}
@keyframes a-blur{from{opacity:0;filter:blur(10px);transform:scale(1.04)}to{opacity:1;filter:none;transform:none}}
[data-step]:not([data-a]){opacity:0;transition:opacity .45s ease, transform .45s var(--ease);transform:translateY(8px)}
[data-step]:not([data-a]).on{opacity:1;transform:none}
[data-step].dimmed{opacity:.28!important;transition:opacity .4s}
.hint-next{position:absolute!important;right:24px;bottom:16px;font:600 11px/1 var(--mono);color:var(--dim);opacity:0;transition:opacity .3s}
.slide.has-more .hint-next{opacity:.7;animation:hn 1.6s ease-in-out infinite}
@keyframes hn{50%{transform:translateX(4px)}}

.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ------------------------------------------------------------------ */
/* Arayüz kabuğu: ilerleme, sayaç, oklar, notlar, harita, sorular       */
/* ------------------------------------------------------------------ */
#bar{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .35s ease;z-index:20}
#hud{position:fixed;right:22px;bottom:14px;font:600 13px/1 var(--mono);color:var(--dim);display:flex;gap:6px;z-index:20}
#hud b{color:var(--brand)}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(14,19,27,.8);color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .25s;z-index:20}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#navp{left:16px} #navn{right:16px}
.nav:hover{color:var(--ink);border-color:var(--brand)}
body.navon .nav{opacity:.85}
.nav:disabled{opacity:0!important;pointer-events:none}

.panel{position:fixed;z-index:30;background:rgba(10,14,20,.97);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .3s var(--ease),opacity .3s;backdrop-filter:blur(8px)}
#notes{left:0;right:0;bottom:0;max-height:44vh;overflow:auto;padding:16px 26px 20px;transform:translateY(105%);border-radius:16px 16px 0 0}
#notes.on{transform:none}
#notes h4,.panel h4{margin:0 0 8px;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--brand);display:flex;gap:14px;align-items:center}
#notes h4 span{color:var(--dim);letter-spacing:.06em}
#ntxt{font:400 17px/1.6 var(--sans);color:var(--ink);white-space:pre-wrap;max-width:110ch}
#nuse{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font:400 14px/1.55 var(--sans);color:var(--muted);max-width:120ch}
#nuse b{color:var(--brand2)}
#toc{top:0;right:0;bottom:0;width:380px;padding:20px;overflow:auto;transform:translateX(105%)}
#toc.on{transform:none}
#toc ol{list-style:none;margin:0;padding:0}
#toc li{padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font:500 14px/1.35 var(--sans);display:flex;gap:10px}
#toc li b{color:var(--dim);font-family:var(--mono);min-width:26px}
#toc li em{margin-left:auto;font:500 11px/1.6 var(--mono);color:var(--dim);font-style:normal}
#toc li:hover{background:rgba(255,255,255,.04);color:var(--ink)}
#toc li.cur{background:var(--brand-soft);color:var(--ink)}
#toc li.cur b{color:var(--brand)}
#qa{inset:5vh 8vw;border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.98)}
#qa.on{opacity:1;pointer-events:auto;transform:none}
#qa input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:#0b1017;color:var(--ink);font:500 15px/1.2 var(--sans);margin:4px 0 14px;outline:none}
#qa input:focus{border-color:var(--brand)}
#qal{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
#qal .q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.02)}
#qal .q h5{margin:0 0 6px;font:650 15px/1.35 var(--sans);color:var(--ink)}
#qal .q p{margin:0;font:400 14px/1.55 var(--sans);color:var(--muted)}
#qal .q p b{color:var(--ink)}
#qal .q small{display:block;margin-top:6px;font:500 11px/1 var(--mono);color:var(--dim)}
#help{left:50%;bottom:8px;transform:none;padding:6px 14px;border-radius:999px;font:500 11px/1 var(--mono);color:var(--muted);display:flex;gap:14px;opacity:0;pointer-events:none;transition:opacity .5s}
#help.on{opacity:1}
#help b{color:var(--brand)}
#black{position:fixed;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .4s}
#black.on{opacity:1;pointer-events:auto}

/* ---------------- konuşmacı ekranı ---------------- */
body.speaker #stage,body.speaker .nav,body.speaker #hud,body.speaker #bar,body.speaker #notes,body.speaker #help{display:none!important}
#spk{display:none}
body.speaker #spk{display:grid;position:fixed;inset:0;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;gap:16px;padding:16px;background:var(--bg)}
#spk .top{grid-column:1/3;display:flex;align-items:center;gap:18px;font:600 15px/1 var(--mono);color:var(--muted)}
#spk .top .clock{font-size:28px;color:var(--ink)}
#spk .top .timer{font-size:28px;color:var(--brand)}
#spk .top button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:8px 12px;font:600 12px/1 var(--mono);cursor:pointer}
#spk .top .ttl{margin-left:auto;color:var(--ink);font-family:var(--sans);font-size:18px}
#spk .cur,#spk .nxt{position:relative;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#000}
#spk .left{display:flex;flex-direction:column;gap:12px;min-height:0}
#spk .cur{flex:1}
#spk .right{display:flex;flex-direction:column;gap:12px;min-height:0}
#spk .nxt{height:34%;flex:0 0 auto}
#spk .lbl{position:absolute;left:10px;top:8px;z-index:3;font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--brand);background:rgba(0,0,0,.6);padding:5px 8px;border-radius:6px}
#spk .mini{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#spk .mini .slide{opacity:1;transform:none;transition:none}
#spk .txt{flex:1;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font:400 19px/1.6 var(--sans);white-space:pre-wrap}
#spk .use{border:1px solid var(--line);border-radius:12px;padding:12px 16px;font:400 14px/1.55 var(--sans);color:var(--muted);max-height:34%;overflow:auto}
#spk .use b{color:var(--brand2)}
#spk .steps{font:600 13px/1 var(--mono);color:var(--dim)}

@media (prefers-reduced-motion: reduce){
  [data-a]{opacity:1!important;animation:none!important}
  [data-a="draw"]{stroke-dashoffset:0!important}
  .pulse,.blink,.frame .scr img.on{animation:none!important}
}
/* ---------------- PDF baskısı (?print) ---------------- */
@page{size:1280px 720px;margin:0}
html.print,html.print body{height:auto;overflow:visible;background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
html.print #stage{position:static;display:block}
html.print #deck{width:1280px;height:auto}
html.print .slide{position:relative;border:0;border-radius:0;box-shadow:none;break-after:page}
html.print .slide:last-child{break-after:auto}
html.print *,html.print *::before,html.print *::after{animation:none!important;transition:none!important}
html.print #bar,html.print #hud,html.print .nav,html.print .panel,html.print #black,html.print #spk,html.print .hint-next{display:none!important}

/* ===================== slayt özel stiller ===================== */
#deck{position:relative;width:1280px;height:720px;flex:none}
.ic{width:18px;height:18px;flex:none}
.chip .ic{width:14px;height:14px}
.static [data-a]{opacity:1!important;animation:none!important}
.static [data-a="draw"]{stroke-dashoffset:0!important}
.static [data-step].on{opacity:1!important;transform:none!important;transition:none!important}

/* 1 · kapak */
.cover{display:flex;gap:36px;height:100%;align-items:center}
.cv-l{flex:1;display:flex;flex-direction:column;min-width:0}
.cv-top{display:flex;gap:16px;align-items:center;margin-bottom:26px}
.gu{height:66px;width:auto}
.cv-title{font-size:98px;letter-spacing:-.045em;margin:0 0 16px;line-height:.95}
.cv-thesis{font:600 23px/1.3 var(--sans);color:var(--brand2);margin:20px 0 0}
.cv-logos{display:flex;align-items:center;gap:18px;margin-top:34px}
.cv-logos img{height:34px;width:auto}
.cv-logos i{width:1px;height:32px;background:var(--line2)}
.cv-team{margin-top:14px}
.cv-r{width:540px;flex:none}
.cvsvg{width:100%;height:auto;display:block}

/* 2 · takım */
.team{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;flex:1;min-height:0}
.mem{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px}
.mem .ph{width:172px;height:172px;border-radius:50%;overflow:hidden;border:3px solid #2a2320;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1a2330,#0b1018);color:var(--dim);margin-bottom:14px;box-shadow:0 0 0 7px rgba(247,131,32,.05)}
.mem .ph img{width:100%;height:100%;object-fit:cover}
.mem .ph .ic{width:84px;height:84px;stroke-width:1.1}
.nm{font:650 20px/1.2 var(--sans)}
.un{font-size:14px;color:var(--muted)}
.dp{font-size:13px;color:var(--dim)}
.deg{margin-top:12px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font:600 11px/1 var(--mono);letter-spacing:0;color:var(--muted);border:1px solid var(--line2);background:rgba(255,255,255,.03);padding:8px 13px;border-radius:999px}
.deg i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.deg.on{color:var(--brand2);border-color:rgba(247,131,32,.55);background:var(--brand-soft)}
.deg.on i{background:var(--brand);box-shadow:0 0 8px var(--brand)}

/* 3–4 · problem */
.probsvg{width:100%;height:auto;max-height:480px}
.tcard{display:flex;gap:18px;align-items:center;flex:1}
.thermo{width:66px;height:196px;flex:none}
.tv{font:700 54px/1 var(--sans);letter-spacing:-.03em;margin:4px 0 14px}
.yearsvg{width:100%;height:auto}

/* 5 · θ */
.thsvg{width:100%;height:auto;display:block}
.formula .unit{font-size:.55em;color:var(--dim);margin-left:.35em}
.mini-v{font:650 26px/1 var(--sans)}
.fbar{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.fbar i{display:block;height:100%;width:67%;background:var(--izle);border-radius:3px}
.th-read{display:flex;align-items:center;justify-content:space-between}
.big{font:700 58px/1 var(--sans);letter-spacing:-.03em;color:var(--olcum)}
.big small{font-size:.4em;color:var(--muted);letter-spacing:0}
.th-sub{font-size:14px;color:var(--muted);margin:0}
.th-cap{font:500 19px/1.4 var(--sans);color:var(--ink);margin:0;min-height:54px}
.th-chips{gap:10px;flex-wrap:wrap}

/* 6–7 · donanım */
.pnsvg{width:100%;height:auto;display:block;max-height:512px}
.rf{stroke-dasharray:16 18;animation:rf 1s linear infinite}
@keyframes rf{to{stroke-dashoffset:-34}}
.kit{gap:9px}
.kitrow{display:flex;gap:14px;align-items:flex-start}
.kn{font:700 30px/1 var(--sans);color:var(--brand);min-width:30px;text-align:center}
.kitrow h3{font-size:15.5px}
.kitrow .sub{font-size:13px;line-height:1.45}
.board .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bc{font-size:11px;color:var(--dim)}
.board ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:13px;line-height:1.6}
.fwsvg{width:100%;height:auto;display:block}
.fwst rect{animation:fwh 6s infinite;animation-delay:calc(var(--i) * 1.5s)}
@keyframes fwh{0%,22%{stroke:var(--brand);fill:rgba(247,131,32,.16)}27%,100%{stroke:var(--line2);fill:#0e141c}}
.cadc{display:flex;flex-direction:column}
.cad{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1.75fr;gap:10px}
.cad>div{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.cad span{font:600 11px/1.2 var(--mono);color:var(--dim)}
.cad b{font:700 19px/1.15 var(--sans);color:var(--ink)}
.cad small{font-size:12px;color:var(--muted)}
.cad .mix{border-color:rgba(247,131,32,.4);background:var(--brand-soft)}
.cad .mix b{color:var(--brand)}
.bom{display:flex;gap:22px}
.bom div{display:flex;flex-direction:column}
.bom b{font:700 28px/1.1 var(--sans);color:var(--brand)}
.bom span{font-size:12px;color:var(--dim)}

/* 8–9 · mimari, zincir */
.archsvg{width:100%;height:auto;max-height:478px}
.chainsvg{width:100%;height:auto;display:block}
.modes{display:flex;flex-direction:column;gap:7px}
.md{display:grid;grid-template-columns:165px 1fr 40px 190px;gap:10px;align-items:center;font-size:13.5px}
.mb{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px}
.mn{color:var(--ink)} .mw{color:var(--muted);font-size:12px} .ma{color:var(--dim);font-size:12.5px}
.hi{margin:12px 0 0;font-size:13px;color:var(--muted)}
.rej{display:flex;flex-direction:column;gap:11px}
.rej div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45}
.rej .ic{color:var(--kritik);margin-top:2px}
.rej b{color:var(--ink);display:block;font-size:14px}

/* 10–11 · trend, görülebilirlik */
.trsvg{width:100%;height:auto;display:block}
.vissvg{width:100%;height:auto;display:block}
.vis-read .big{font-size:52px}
.vis-read .chip{margin-top:10px}
.vis-say{font:500 17px/1.4 var(--sans);color:var(--ink);margin:12px 0 0;min-height:48px}

/* 12 · bastırma */
.jgrid{display:grid;grid-template-columns:repeat(10,34px);gap:12px 14px;justify-content:center;margin:10px 0 16px}
.jgrid i{aspect-ratio:1;border-radius:50%;background:#33204f;box-shadow:0 0 14px rgba(0,0,0,.35)}
.cnt{border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.cnt.bad{border-color:rgba(255,107,61,.4);background:rgba(255,107,61,.06)}
.cnt.good{border-color:rgba(53,192,122,.4);background:rgba(53,192,122,.06)}
.cnt .cl{display:block;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cnt b{display:block;font:700 46px/1.1 var(--sans);margin:6px 0 2px}
.cnt.bad b{color:var(--kritik)} .cnt.good b{color:var(--ok)}
.cnt .cs{font-size:12.5px;color:var(--muted)}
.sup{gap:8px}
.suprow{display:flex;flex-direction:column;gap:3px}
.suprow .mono{font-size:12px;color:var(--izle);font-weight:600}
.suprow span:last-child{font-size:13.5px;color:var(--muted)}

/* 13 · ark */
.arc{gap:9px}
.flash{position:relative;height:140px;display:grid;place-items:center}
.flash .ic{width:62px;height:62px;color:#fff;filter:drop-shadow(0 0 18px #7cc4ff);animation:fl 2.4s infinite;position:relative;z-index:1}
.flash i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid #7cc4ff;animation:ring 2.4s infinite}
.flash i:nth-child(2){animation-delay:.25s}
.flash i:nth-child(3){animation-delay:.5s}
@keyframes ring{0%{transform:scale(.6);opacity:1}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes fl{0%,5%{opacity:1;filter:drop-shadow(0 0 34px #fff) drop-shadow(0 0 12px #7cc4ff)}12%,100%{opacity:.85}}
.arc-kv{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
.arc-kv b{color:var(--ink);font-size:14px;text-align:right}
.arc-kv small{display:block;font-size:11px}
.lat{display:flex;flex-direction:column;justify-content:space-evenly}
.latrow{display:grid;grid-template-columns:70px 1fr 60px;gap:12px;align-items:center;margin:10px 0}
.latrow>span{font-size:12px;color:var(--muted)}
.latrow>b{font-size:15px}
.lbar{position:relative;height:42px;border-radius:6px;background:rgba(255,255,255,.03)}
.lbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.s0{background:#ffffff} .s1{background:var(--uyari)} .s2{background:var(--izle)} .s3{background:#b18cff} .s4{background:var(--kritik)}
.laxis{position:relative;height:16px;margin:0 72px 0 82px;font:11px var(--mono);color:var(--dim)}
.laxis span{position:absolute;transform:translateX(-50%)}
.lleg{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-top:22px;font-size:14px;color:var(--muted)}
.lleg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.lleg i{width:12px;height:12px;border-radius:3px}
.lleg b{font-size:12px;color:var(--ink)}
.lleg em{grid-column:2/4;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:-5px}

/* 14 · merdiven, telefon */
.ladder{display:flex;flex-direction:column;gap:10px;justify-content:center}
.lad{width:var(--w);display:grid;grid-template-columns:58px 52px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.02);font-size:13px}
.lad .ln{font-weight:700}
.lad.acil{border-color:rgba(255,47,121,.5);background:rgba(255,47,121,.08)} .lad.acil .ln{color:var(--acil)}
.lad.kritik{border-color:rgba(255,107,61,.5);background:rgba(255,107,61,.08)} .lad.kritik .ln{color:var(--kritik)}
.lad.uyari{border-color:rgba(244,177,58,.45)} .lad.uyari .ln{color:var(--uyari)}
.lad.izle{border-color:rgba(74,163,255,.45)} .lad.izle .ln{color:var(--izle)}
.lt{font-size:11.5px;color:var(--muted)} .la{color:var(--muted);font-size:12.5px}
.lp .ic{width:16px;height:16px;color:var(--ink)}
.phone{width:262px;flex:none;border-radius:34px;border:2px solid #2a3542;padding:10px;background:#05070a;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 6px #0c1117}
.pscr{height:100%;border-radius:25px;background:#0b0f15;padding:16px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ptop{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--line)}
.bub{max-width:94%;padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.bub.in{background:#1a2330;color:var(--ink);border-bottom-left-radius:4px;min-height:42px}
.bub.out{align-self:flex-end;background:var(--brand);color:#1a0d00;font-weight:650;border-bottom-right-radius:4px}
.bub.sys{align-self:center;border:1px dashed var(--ok);color:var(--ok);font-size:11.5px;text-align:center}
.esc{gap:9px}
.escrow{display:flex;gap:12px;align-items:center}
.escrow h3{font-size:14.5px}
.et{min-width:74px;font-size:12px;color:var(--brand)}

/* 15 · SCADA */
.regs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.regs i{aspect-ratio:1.5;display:grid;place-items:center;font:500 11px var(--mono);color:var(--dim);background:#0d131b;border:1px solid var(--line);border-radius:4px;font-style:normal;animation:rg 3.2s infinite;animation-delay:calc(var(--k) * .05s)}
.regs i.k{color:var(--ink);border-color:var(--brand);background:var(--brand-soft)}
@keyframes rg{0%,5%{box-shadow:inset 0 0 0 2px var(--izle)}10%,100%{box-shadow:none}}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--dim);padding:4px 6px;border-bottom:1px solid var(--line)}
.rt td{padding:6px;border-bottom:1px solid var(--line);color:var(--muted)}
.rt td.b{color:var(--olcum);font-weight:600}
.term{background:#05070a;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font:13px/1.65 var(--mono);color:var(--ink)}
.term .pr{color:var(--ok)}
.term .err{color:var(--kritik);font-weight:700}
.term.on{animation:shake .45s .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* 16 · demo */
.frame.grow{display:flex;flex-direction:column;min-width:0}
.frame.grow .scr{aspect-ratio:auto;flex:1}
.scrl{gap:8px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.shot{margin:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#0c1014}
.shot img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top left;border-bottom:1px solid var(--line)}
.shot figcaption{padding:6px 11px 7px;font-size:12px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot figcaption b{color:var(--ink);font-weight:650;margin-right:8px}
.shots-note{margin-top:auto}
.sci{appearance:none;cursor:pointer;display:block;position:relative;width:100%;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);overflow:hidden;font:inherit;color:inherit}
.sci b{display:block;font:650 15px var(--sans);color:var(--ink)}
.sci span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.sci.on{border-color:var(--brand);background:var(--brand-soft)}
.sci i{position:absolute;left:0;bottom:0;height:2px;background:var(--brand);width:0}
.sci.on i{animation:prog 6s linear forwards}
@keyframes prog{to{width:100%}}

/* 17 · saha */
.clk{width:270px;height:270px}
.steps6{gap:7px}
.st6{display:grid;grid-template-columns:34px 1fr 50px;gap:12px;align-items:center}
.st6 .si{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.st6.kritik .si{background:rgba(255,107,61,.12);color:var(--kritik)}
.st6.uyari .si{background:rgba(244,177,58,.12);color:var(--uyari)}
.st6.ok .si{background:rgba(53,192,122,.12);color:var(--ok)}
.st6 h3{font-size:14.5px;margin:0 0 2px}
.st6 .sub{font-size:13.5px;line-height:1.4}
.sm{font-size:12px;color:var(--muted);text-align:right}

/* 18 · ölçek */
.scl{display:flex;flex-direction:column;gap:12px;justify-content:space-evenly}
.scl .sb{height:46px}
.sch,.scr2{display:grid;grid-template-columns:140px 1fr 1fr 1fr;gap:14px;align-items:center}
.sch b{font:650 14px var(--sans);color:var(--ink)}
.sn{font-size:13.5px;color:var(--muted)}
.sb{position:relative;height:36px;display:flex;align-items:center}
.sb i{position:absolute;left:0;top:4px;bottom:4px;border-radius:6px}
.sb i.izle{background:linear-gradient(90deg,rgba(74,163,255,.15),rgba(74,163,255,.55))}
.sb i.olcum{background:linear-gradient(90deg,rgba(255,234,70,.12),rgba(255,234,70,.45))}
.sb i.brand{background:linear-gradient(90deg,rgba(247,131,32,.15),rgba(247,131,32,.6))}
.sb span{position:relative;padding-left:10px;font-size:14px;font-weight:600;color:var(--ink)}
.srv div{font-size:12.5px;color:var(--muted)}
.topo{width:100%;height:auto;display:block;margin-bottom:6px}

/* 19 · maliyet */
.costsvg{width:100%;height:auto;display:block}
.kpi .v{font-size:30px}

/* 20 · veri */
.sersvg{width:100%;height:auto;display:block;margin:4px 0}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tst{display:flex;flex-direction:column;gap:4px}
.tn{font-size:13px;color:var(--muted)}
.tst b{font-size:20px}
.te{font-size:11.5px;color:var(--dim)}

/* 21–22 · dürüstlük, özet */
.nogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
.nog{display:flex;flex-direction:column;gap:6px}
.nx{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,107,61,.12);color:var(--kritik);margin-bottom:4px}
.nog{padding:20px 22px}
.nog h3{font-size:19px;margin-top:4px}
.nog .sub{font-size:15px;line-height:1.55}
.reqs{display:flex;flex-direction:column;justify-content:space-between}
.rq{display:grid;grid-template-columns:100px 220px 1fr;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.rq:last-child{border-bottom:0}
.rq b{font-size:14.5px}
.rq .sub{font-size:13px}
.rq .chip{justify-content:center}
.kpi.mini .v{font-size:26px}
.kpi.mini .l{font-size:12.5px;margin-top:4px}

/* 23 · kapanış */
.end .end-t{font-size:56px;max-width:15ch;margin-bottom:22px}
.ends{display:flex;flex-direction:column;gap:12px}
.ends div{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:baseline}
.ends b{font:700 18px var(--sans);color:var(--brand)}
.ends span{font-size:16px;color:var(--muted)}
.thanks{font:600 22px var(--sans);margin:22px 0 0;color:var(--ink)}
.end .cv-r{width:480px}

.arc-note{margin-top:auto;font-size:12.5px;line-height:1.5}

</style>

<script>
/* Ortak SVG yardımcıları, renk ölçekleri ve simgeler. */
const H = {
  line(pts) { return 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'); },
  smooth(pts) {
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  },
  sc(d0, d1, r0, r1) { const k = (r1 - r0) / (d1 - d0); return v => r0 + (v - d0) * k; },
  rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; },
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  ease(p) { p = H.clamp(p, 0, 1); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
  /* termal renk ölçeği (inferno yaklaşık) — yalnız ısı görselleri için */
  heat(t) {
    const S = [[0, [0, 0, 4]], [.15, [31, 12, 72]], [.3, [85, 15, 109]], [.45, [136, 34, 106]], [.6, [186, 54, 85]],
               [.72, [227, 89, 51]], [.85, [249, 142, 9]], [.95, [244, 209, 58]], [1, [252, 255, 164]]];
    t = H.clamp(t, 0, 1);
    for (let i = 1; i < S.length; i++) if (t <= S[i][0]) {
      const [a, ca] = S[i - 1], [b, cb] = S[i], k = (t - a) / (b - a);
      return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(',')})`;
    }
    return 'rgb(252,255,164)';
  },
  sev(theta) {
    if (theta >= 25) return ['Acil', 'acil'];
    if (theta >= 12) return ['Kritik', 'kritik'];
    if (theta >= 5) return ['Uyarı', 'uyari'];
    if (theta >= 2) return ['İzle', 'izle'];
    return ['Bilgi', ''];
  },
};

function coverSVG(p = 'cv') {
  const cx = k => 52 + k * 41, LY = 232, OFF = [-11, -4, 4, 11];
  const CAB = ['var(--l1)', 'var(--l2)', 'var(--l3)', 'var(--nn)'];
  const rnd = H.rng(7);
  let base = '', therm = '';
  for (let k = 0; k < 12; k++) {
    const x = cx(k), spare = k >= 10;
    base += `<text x="${x}" y="60" text-anchor="middle" class="mono" font-size="10" fill="var(--dim)">${spare ? 'Y' + (k - 9) : 'Ç' + (k + 1)}</text>`;
    if (spare) { base += `<rect x="${x - 15}" y="70" width="30" height="126" rx="3" fill="url(#${p}h)" stroke="var(--line2)"/>`; continue; }
    base += `<rect x="${x - 15}" y="70" width="30" height="126" rx="3" fill="#0d131b" stroke="#33414f"/>
      <rect x="${x - 11}" y="76" width="22" height="10" rx="2" fill="#1a2330"/>
      ${[-9, -2, 5].map(o => `<rect x="${x + o}" y="98" width="5" height="72" rx="2" fill="#18212c" stroke="#2c3a48"/>`).join('')}`;
    OFF.forEach((o, j) => {
      base += `<line x1="${x + o}" y1="${LY + 4}" x2="${x + o}" y2="470" stroke="${CAB[j]}" stroke-width="3.2" ${j === 1 ? 'stroke-opacity=".95"' : ''}/>
        <circle cx="${x + o}" cy="${LY}" r="3.4" fill="#cfd6de" stroke="#0b0f14"/>`;
      const hot = k === 6 && j === 1;
      const t = hot ? 1 : (j === 3 ? .4 : .5) + rnd() * .1 + (k === 5 || k === 6 ? .06 : 0);
      therm += `<line x1="${x + o}" y1="${LY}" x2="${x + o}" y2="470" stroke="${H.heat(t * (hot ? .8 : .62))}" stroke-width="${hot ? 7 : 5}" stroke-opacity=".75" filter="url(#${p}b)"/>
        <line x1="${x + o}" y1="${LY}" x2="${x + o}" y2="${LY + (hot ? 110 : 40)}" stroke="${H.heat(t * .9)}" stroke-width="${hot ? 5 : 3}" stroke-linecap="round"/>
        <circle cx="${x + o}" cy="${LY}" r="${hot ? 24 : 10}" fill="${H.heat(t)}" filter="url(#${p}b)"/>
        <circle cx="${x + o}" cy="${LY}" r="${hot ? 6 : 3.8}" fill="${hot ? '#fffbd0' : H.heat(Math.min(1, t + .14))}"/>`;
    });
    therm += `<rect x="${x - 15}" y="70" width="30" height="126" rx="3" fill="${H.heat(.24 + rnd() * .05)}"/>
      ${[-9, -2, 5].map(o => `<rect x="${x + o}" y="98" width="5" height="72" rx="2" fill="${H.heat(.34 + rnd() * .06)}"/>`).join('')}`;
  }
  const tc = [5, 6].map(k => [0, 1, 2].map(j => `<rect x="${cx(k) + OFF[j] - 3.5}" y="268" width="7" height="15" rx="2" fill="var(--brand)"/>`).join('')).join('');
  return `<svg viewBox="0 0 560 520" class="cvsvg" aria-label="Alt kablo bölmesi, termal tarama">
  <defs>
    <pattern id="${p}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#26313d" stroke-width="2"/></pattern>
    <filter id="${p}b" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="3.6"/></filter>
    <linearGradient id="${p}trail" x1="1" x2="0"><stop offset="0" stop-color="#ffb066" stop-opacity=".35"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></linearGradient>
    <linearGradient id="${p}fov" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f78320" stop-opacity=".22"/><stop offset="1" stop-color="#f78320" stop-opacity="0"/></linearGradient>
    <radialGradient id="${p}bg" cx="${(cx(6) - 4) / 560}" cy="${LY / 520}" r=".9"><stop offset="0" stop-color="#3b0d5e"/><stop offset=".5" stop-color="#1a0838"/><stop offset="1" stop-color="#0a0418"/></radialGradient>
    <clipPath id="${p}clip"><rect id="${p}cr" x="0" y="0" width="0" height="520"/></clipPath>
  </defs>
  <rect x="14" y="20" width="532" height="486" rx="12" fill="#080b10" stroke="var(--line2)"/>
  <text x="28" y="40" class="mono" font-size="10.5" fill="var(--dim)">EK-II/14 · alt kablo bölmesi · 48 pabuç pozisyonu</text>
  ${base}${tc}
  <polygon points="270,486 44,${LY} 500,${LY}" fill="url(#${p}fov)"/>
  <rect x="252" y="484" width="36" height="14" rx="3" fill="#1c2632" stroke="var(--brand)"/>
  <text x="296" y="495" class="mono" font-size="9.5" fill="var(--muted)">TN-IR 32×24</text>
  <g id="${p}th" clip-path="url(#${p}clip)">
    <rect x="15" y="21" width="530" height="484" rx="12" fill="url(#${p}bg)"/>
    ${therm}
    <circle cx="${cx(6) - 4}" cy="${LY}" r="12" fill="none" stroke="#fcd34d" stroke-width="2"><animate attributeName="r" values="10;26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="28" y="40" class="mono" font-size="10.5" fill="#c9b8ff">termal görünüm · kardeş farkı</text>
  </g>
  <g id="${p}scan" style="opacity:0"><rect x="-46" y="21" width="46" height="484" fill="url(#${p}trail)"/><line x1="0" y1="21" x2="0" y2="505" stroke="#ffb066" stroke-width="2"/></g>
  <g id="${p}call" style="opacity:0;transition:opacity .5s">
    <path d="M${cx(6) - 4},${LY + 16} L318,318" stroke="var(--kritik)" stroke-width="1.5" fill="none"/>
    <rect x="308" y="300" width="230" height="100" rx="10" fill="rgba(6,8,12,.95)" stroke="var(--kritik)"/>
    <text x="324" y="323" font-size="12" fill="var(--muted)">Ç7 · L2 · çıkış pabucu</text>
    <rect x="462" y="309" width="62" height="21" rx="10.5" fill="rgba(255,107,61,.14)" stroke="var(--kritik)"/>
    <text x="493" y="323.5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="var(--kritik)">Kritik</text>
    <text x="324" y="360" font-size="29" font-weight="700" fill="var(--olcum)">θ = 17,6 K</text>
    <text x="324" y="386" class="mono" font-size="11" fill="var(--muted)">ACİL eşiğine ~15 gün (13–19)</text>
  </g>
</svg>`;
}

  scene(el, { REDUCED }, p = 'cv') {
    const cr = el.querySelector('#' + p + 'cr'), scan = el.querySelector('#' + p + 'scan'), call = el.querySelector('#' + p + 'call'), th = el.querySelector('#' + p + 'th');
    const XH = 52 + 6 * 41 - 4;
    if (REDUCED) { cr.setAttribute('width', 560); call.style.opacity = 1; return null; }
    let raf, t0 = performance.now();
    const loop = t => {
      const T = ((t - t0) / 1000) % 10;
      const p = H.ease((T - .8) / 3.6), x = p * 560;
      cr.setAttribute('width', x.toFixed(1));
      scan.setAttribute('transform', `translate(${x.toFixed(1)},0)`);
      scan.style.opacity = p > 0 && p < 1 ? 1 : 0;
      call.style.opacity = x > XH + 8 && T < 9.4 ? 1 : 0;
      th.style.opacity = T > 9.4 ? Math.max(0, 1 - (T - 9.4) / .5) : 1;
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    return { stop() { cancelAnimationFrame(raf); } };
  },
  notes: `Merhaba, biz Takım ${TEAM.name}. ADM ve GDZ Elektrik'in Grid Up hackathon'unda "Pano/Hücre İçi Anomali Erken Uyarı Sistemi" problemini çalıştık. Ürünümüzün adı PANO GÖZ.

  use: `<b>Kullan:</b> Açılış — 30 saniyeyi geçmeyin. Tarama bitip etiket çıktığında "biri hariç" cümlesini söyleyin. <b>Ezberlenecek:</b> 1600 kVA · TEDAŞ-MLZ/2003-06.B · 48 pabuç pozisyonu · Ç7-L2. <b>Dikkat:</b> 17,6 K ve "~15 gün (13–19)" 3 Ekim demo koşusundan (24 pano, 45 gün geçmiş) alındı; provada kullanacağınız koşunun sayısıyla değiştirin. <b>Kısayollar:</b> N konuşma metni · S konuşmacı ekranı · O slayt haritası · Q jüri soruları · B kararart · F tam ekran · P metni yazdır.`,
});

function thermo(v, col, d) {
  const top = 14, bot = 176, lvl = bot - v / 100 * (bot - top);
  return `<svg viewBox="0 0 80 220" class="thermo">
   <rect x="24" y="8" width="22" height="182" rx="11" fill="#0b1018" stroke="var(--line2)" stroke-width="2"/>
   ${[0, 20, 40, 60, 80, 100].map(t => `<line x1="48" x2="56" y1="${bot - t / 100 * (bot - top)}" y2="${bot - t / 100 * (bot - top)}" stroke="var(--dim)"/><text x="58" y="${bot - t / 100 * (bot - top) + 4}" font-size="9" class="mono" fill="var(--dim)">${t}</text>`).join('')}
   <rect x="30" y="${lvl}" width="10" height="${bot - lvl + 12}" rx="5" fill="${col}" data-a="grow-y" style="--d:${d}s;animation-duration:1.4s"/>
   <circle cx="35" cy="196" r="17" fill="${col}"/>
  </svg>`;
}
function yearSVG() {
  const X = H.sc(0, 11, 60, 610), Y = H.sc(20, 100, 300, 24);
  const h = m => 49 + 13 * Math.cos(2 * Math.PI * (m - 7) / 12), f = m => h(m) + 26;
  const P = fn => { const p = []; for (let m = 0; m <= 11.001; m += .25) p.push([X(m), Y(fn(m))]); return H.smooth(p); };
  const AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  return `<svg viewBox="0 0 640 340" class="yearsvg">
   ${[20, 40, 60, 80, 100].map(t => `<line x1="60" x2="610" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="50" y="${Y(t) + 4}" text-anchor="end" class="mono" font-size="11" fill="var(--dim)">${t}</text>`).join('')}
   ${AY.map((a, m) => `<text x="${X(m)}" y="322" text-anchor="middle" font-size="11" fill="${m === 1 || m === 7 ? 'var(--ink)' : 'var(--dim)'}">${a}</text>`).join('')}
   <g data-step="2"><rect x="${X(0)}" y="24" width="${X(3.45) - X(0)}" height="276" fill="rgba(255,107,61,.10)"/><rect x="${X(10.55)}" y="24" width="${X(11) - X(10.55) + 1}" height="276" fill="rgba(255,107,61,.10)"/>
     <text x="${X(1.7)}" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="var(--kritik)">kör bölge</text></g>
   <path d="${P(h)}" fill="none" stroke="var(--ok)" stroke-width="3" data-a="draw" style="--d:.3s"/>
   <path d="${P(f)}" fill="none" stroke="var(--kritik)" stroke-width="3" stroke-dasharray="0" data-a="draw" style="--d:.6s"/>
   <line x1="60" x2="610" y1="${Y(72)}" y2="${Y(72)}" stroke="var(--uyari)" stroke-width="2" stroke-dasharray="8 6" data-a="grow-x" style="--d:1.2s"/>
   <text x="${X(5.5)}" y="${Y(72) - 8}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--uyari)" data-a="fade" style="--d:1.4s">sabit eşik 72 °C</text>
   <text x="${X(9.7)}" y="${Y(h(9.7)) + 24}" text-anchor="middle" font-size="12" fill="var(--ok)" data-a="fade" style="--d:1s">sağlam pabuç</text>
   <text x="${X(7)}" y="${Y(f(7)) - 12}" text-anchor="middle" font-size="12" fill="var(--kritik)" data-a="fade" style="--d:1.2s">kusurlu pabuç</text>
   <circle cx="${X(1)}" cy="${Y(62)}" r="6" fill="var(--kritik)" data-a="pop" style="--d:1.6s"/><circle cx="${X(7)}" cy="${Y(62)}" r="6" fill="var(--ok)" data-a="pop" style="--d:1.7s"/>
   <text x="${X(1) + 10}" y="${Y(62) - 10}" font-size="12" class="mono" fill="var(--ink)" data-a="fade" style="--d:1.7s">62 °C</text>
   <text x="${X(7)}" y="${Y(62) - 12}" text-anchor="middle" font-size="12" class="mono" fill="var(--ink)" data-a="fade" style="--d:1.8s">62 °C</text>
  </svg>`;
}

   ${C.map((x, i) => `

   <line id="thmed" x1="76" x2="444" y1="200" y2="200" stroke="var(--izle)" stroke-width="2" stroke-dasharray="6 5"/>

add({
  title: 'θ: kardeşine göre fark', section: 'Fikir', time: '70 sn',
  html: () => `${HD('02 · Fikir', 'θ: bir bağlantının, kendi kardeş fazlarına göre fazla ısısı.')}
<div class="body"><div class="row grow">
  <div class="card" style="width:540px;padding:8px 10px;--d:.2s" data-a="blur">${thetaSVG()}</div>
  <div class="col grow">
    <div class="card" data-a="up" style="--d:.2s"><div class="formula">θ = <span class="frac"><span>T − medyan(kardeşler)</span><span>(I / I<sub>ref</sub>)²</span></span><span class="unit">K</span></div></div>
    <div class="g2" data-a="up" style="--d:.3s">
      <div class="card tight"><p class="cap">Ortam</p><div class="mini-v"><span id="thamb">30,0</span> °C</div></div>
      <div class="card tight"><p class="cap">Yük · I / I<sub>ref</sub></p><div class="mini-v" id="thf">0,67</div><div class="fbar"><i id="thfb"></i></div></div>
    </div>
    <div class="card th-read" data-a="up" style="--d:.4s"><div><p class="cap">θ · L2 pabucu</p><div class="big"><span id="thv">0,00</span><small> K</small></div></div><span id="thsev" class="chip"><i></i>Bilgi</span></div>
    <p class="mono th-sub" id="thsub" data-a="fade" style="--d:.5s">—</p>
    <p class="th-cap" id="thcap" data-a="fade" style="--d:.5s">—</p>
  </div>
</div>
<div class="row th-chips" data-a="up" style="--d:.7s">
  <span class="chip ok">${IC.check} Yük sadeleşir · I² paydada</span><span class="chip ok">${IC.check} Mevsim ve güneş sadeleşir · aynı hava</span><span class="chip ok">${IC.check} Yayıcılık sadeleşir · aynı yüzey</span><span class="chip brand">Geçmiş gerekmez · montaj günü referans</span>
</div></div>`,
  scene(el, { REDUCED }) {
    const q = s => el.querySelector(s);
    const fill = [0, 1, 2].map(i => q('#thf' + i)), txt = [0, 1, 2].map(i => q('#tht' + i));
    const BASE = [20.944, 21.094, 21.244]; // ortam 30 °C, k = 40, f = 0,67 → 68,90 / 69,05 / 69,20 °C (docs/08 §2)
    const Y = T => 352 - (T - 20) / 80 * 284;
    const set = (amb, f, R) => {
      const T = BASE.map((c, i) => amb + c + 40 * f * f + (i === 1 ? R * f * f : 0));
      T.forEach((t, i) => {
        const y = Y(t); fill[i].setAttribute('y', y.toFixed(1)); fill[i].setAttribute('height', (352 - y).toFixed(1));
        fill[i].setAttribute('fill', H.heat(.42 + (t - 55) / 60)); txt[i].textContent = fmt(t, 1) + '°';
      });
      const med = (T[0] + T[2]) / 2, dT = T[1] - med, th = dT / (f * f);
      const ym = Y(med), y2 = Y(T[1]);
      q('#thmed').setAttribute('y1', ym); q('#thmed').setAttribute('y2', ym);
      q('#thmedt').setAttribute('y', ym - 4); q('#thmedt2').setAttribute('y', ym + 9);
      q('#thdl').setAttribute('y1', ym); q('#thdl').setAttribute('y2', y2); q('#thdt').setAttribute('y', (ym + y2) / 2 + 4);
      q('#thdel').style.opacity = dT > .3 ? 1 : 0;
      q('#thamb').textContent = fmt(amb, 1); q('#thf').textContent = fmt(f, 2); q('#thfb').style.width = (f * 100) + '%';
      const v = Math.abs(th) < .005 ? 0 : th;
      q('#thv').textContent = fmt(v, 2);
      const [lab, cls] = H.sev(v); const s = q('#thsev'); s.className = 'chip ' + cls; s.innerHTML = '<i></i>' + lab;
      q('#thsub').textContent = `(${fmt(T[1], 2)} − ${fmt(med, 2)}) / ${fmt(f, 2)}² = ${fmt(v, 2)} K`;
    };
    const CAP = [
      [0, 'Montaj günü: üç kardeş aynı. Referans hazır; geçmiş gerekmez.'],
      [2, 'Sıcak hava dalgası: üçü birden +6,1 K. θ değişimi: sıfır.'],
      [6, 'Yük %67 → %95: Joule ısısı üçünde de I² ile artar, paydada sadeleşir.'],
      [10, 'Yalnız L2 ısınıyor: gevşek bağlantı. θ yükselir.'],
      [13.4, 'Yük değişse de θ aynı kalır: ΔT değişir, θ değişmez.'],
    ];
    const seg = (t, a, b, v0, v1) => v0 + (v1 - v0) * H.ease((t - a) / (b - a));
    const at = t => {
      let amb = 30, f = .67, R = 0;
      if (t >= 2 && t < 5.4) amb = seg(t, 2, 3.4, 30, 36.1); else if (t >= 5.4 && t < 6) amb = seg(t, 5.4, 6, 36.1, 30);
      if (t >= 6 && t < 9.4) f = seg(t, 6, 7.4, .67, .95); else if (t >= 9.4 && t < 10) f = seg(t, 9.4, 10, .95, .67);
      if (t >= 10) R = seg(t, 10, 12.4, 0, 6.349);
      if (t >= 13.4 && t < 14.6) f = seg(t, 13.4, 14.4, .67, .40);
      else if (t >= 14.6 && t < 16.4) f = seg(t, 14.6, 16, .40, .95);
      else if (t >= 16.4 && t < 17.4) f = seg(t, 16.4, 17.2, .95, .67);
      if (t >= 18.2) R = seg(t, 18.2, 19, 6.349, 0);
      set(amb, f, R);
      let c = CAP[0][1]; for (const [s, x] of CAP) if (t >= s) c = x;
      const cp = q('#thcap'); if (cp.textContent !== c) cp.textContent = c;
    };
    if (REDUCED) { at(12.5); return null; }
    let raf, t0 = performance.now();
    const loop = now => { at(((now - t0) / 1000) % 19.2); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return { stop() { cancelAnimationFrame(raf); } };
  },
  notes: `Bizim cevabımız θ. Formül üstte: bir bağlantının sıcaklığından, kendi kardeşlerinin medyanını çıkarıyoruz ve sonucu anma akımına göre normalize ediyoruz — yani (I bölü I_ref) karesine bölüyoruz. Birimi kelvin: "bu bağlantı anma akımını taşısaydı, kardeşlerinden ne kadar sıcak olurdu?"

Kardeş ne demek? Aynı fiderin üç fazı: aynı akımı taşıyorlar, aynı havayı soluyorlar, yirmi milimetre arayla duruyorlar, aynı yaştalar. Renkler TEDAŞ'ın kablo renkleri: L1 gri, L2 siyah, L3 kahverengi.

Animasyonu izleyelim:
— Sıcak hava dalgası geliyor: üç faz birden 6,1 kelvin ısınıyor. Eşik sistemi burada alarm verirdi. θ ise kıpırdamıyor; çünkü hava üçüne birden aynı şeyi yapıyor ve fark sıfır kalıyor.
— Yük artıyor: Joule ısısı üçünde de akımın karesiyle artıyor. Paydaya I² koyduğumuz için bu da sadeleşiyor.
— Şimdi yalnız L2 ısınıyor. Gevşek bağlantı tam olarak budur: tek fazda fazla temas direnci. θ altı virgül otuz beş kelvine çıkıyor, Uyarı seviyesi.
— Ve en önemlisi: yük düşse de artsa da θ aynı kalıyor. Ham sıcaklık farkı değişiyor, θ değişmiyor. Ölçtüğümüz şey yük değil, bağlantının kendisi.

Üç şey sadeleşiyor: yük, mevsim ve güneş, IR tarafında yayıcılık. Ve geçmiş gerektirmiyor: montaj günü üç kardeş zaten birbirinin referansı. Bu yeni bir icat değil — termografi pratiğinin "benzer bileşene göre benzer yük altında ΔT" ölçütü. Fark şu: yılda bir müteahhit değil, dakikada bir sistem ölçüyor.`,
  use: `<b>Kullan:</b> Animasyon kendini döndürür (≈19 sn). Bir tur izletin; anlatımı alttaki başlığa göre senkronlayın. <b>Ezberlenecek:</b> (71,90 − 69,05) / 0,67² = 6,35 K · hava dalgasında ölçülen θ kayması 0,0000 K. <b>Jüri sorarsa — "Kalibrasyon?":</b> θ bir farktır; iki sensörün ortak sapması çıkar. Mutlak doğruluk yalnız 110/130 °C limitleri için gerekir, TMP117 fabrikada ±0,1 °C. <b>Dürüst sınır:</b> kabin havalandırması tıkanırsa kardeşler arasında tam sadeleşmez (ölçülen kayma ≤ 2,9 K); ayırt edici işaret her bağlantının birlikte yükselmesidir.`,
});

  scene(el, { REDUCED }) {

    const put = hr => {
      const f = .55 - .37 * Math.cos(2 * Math.PI * (hr - 3) / 24);
      const m = 3 * .2 / (f * f);
      q('#vsd').setAttribute('cx', X(f)); q('#vsd').setAttribute('cy', Y(Math.min(30, m)));

  notes: `Bir kusur, yük faktörü f'te gözlenen farkı yalnız θ çarpı f kare kadar büyütür. Yük düştükçe aynı kusuru görmek zorlaşır. Bunu saklamıyoruz, hesaplıyoruz: görülebilen en küçük θ, üç sigma bölü f kare.

Noktayı izleyin: günün saatine göre yük değişiyor. Öğleden sonra, tam yüke yakınken kelepçe yarım kelvinlik bir kusuru bile görüyor. Gece üçte, yüzde on sekiz yükte bu sayı on sekiz buçuk kelvine çıkıyor.

Rakip bir ürün gece yarısı "her şey normal" der. Biz "şu anda on sekiz buçuk kelvinin altındaki bir kusuru göremiyorum" diyoruz. İkincisi kullanılabilir bir bilgi. Bu bir arıza değil, bir görünürlük durumu: ayrı raporlanıyor, SCADA'da da ayrı bir bit.

Ve mutlak sıcaklık limitleri bu sırada da açık: yüz otuz derecedeki bir pabuç, yük ne olursa olsun yüz otuz derecedir. Kör olduğumuz yeri söylemek bir kusur değil, ürünün özelliği.`,

function seriesSVG(kind) {
  const W = 520, Hh = 150, n = 152, r = H.rng(kind === 'real' ? 5 : 9), pts = [];
  for (let i = 0; i < n; i++) {
    const hr = (i * .25) % 24;
    let v = kind === 'real' ? 45 + 26 * Math.max(0, Math.sin((hr - 6) / 24 * 2 * Math.PI)) + 9 * Math.exp(-Math.pow(hr - 20, 2) / 6) + (r() - .5) * 3 : 15 + Math.floor(r() * 76);
    pts.push([10 + i / (n - 1) * (W - 20), Hh - 8 - (v - 10) / 85 * (Hh - 20)]);
  }
  return `<svg viewBox="0 0 ${W} ${Hh}" class="sersvg"><path d="${H.line(pts)}" fill="none" stroke="${kind === 'real' ? 'var(--ok)' : 'var(--kritik)'}" stroke-width="1.8" data-a="draw" style="--d:${kind === 'real' ? .3 : .6}s;--dur:2.2s"/></svg>`;
}

/* JÜRİ SORULARI — hazır cevaplar (Q)                                    */

const QA = [

  { q: 'PD ölçümünüz IEC 60270\'e göre mi?', a: '<b>Hayır ve iddia etmiyoruz.</b> 400 V\'ta klasik PD oluşmaz (Paschen minimumu 327 V). RF kanalı gevşek bağlantı mikro-arkını ölçer, pC <b>eşdeğeri</b> raporlar ve AG\'de tek başına ekip yönlendirmez.', ref: 'docs/04 §9.3' },
  { q: 'Yanlış alarm hızınız ne?', a: 'Analitik: 100 pano × 40 bağlantıda <b>4,8 günde bir yanlış CUSUM geçişi</b>. Ama geçiş alarm değildir; alarm üç şart ister (CUSUM > 8, θ ≥ 5 K, son 5 günün 3\'ü). Bu bir üst sınırdır. Gerçek oran ancak etiketli pilot sahada ölçülür.', ref: 'docs/04 §5.4' },
  { q: 'Standart hangi sıcaklığı yasaklıyor?', a: 'TS EN 61439-1, bara cıvatalı bağlantısı için sayısal limit koymaz. 110/130 °C bizim <b>mühendislik çıkarımımızdır</b> ve öyle etiketlidir (105 °C kablo yalıtımı, 120 °C üstü oksidasyon, kalayın 232 °C erimesi). Çizelge 8 değerleri gelirse tek satırda değişir.', ref: 'docs/04 §8.2' },
  { q: 'Pil ne kadar dayanır?', a: '<b>Hesaplandı, ölçülmedi:</b> 8,4–16 yıl; bağlayıcı düğüm PD-01. Tezgâh ölçümü açık sorular listemizde. 8. yıl toplu hücre değişimi gösterge olarak modül başına ~€18 + ziyaret.', ref: 'docs/02 §5' },
  { q: 'Bozulma hızlanırsa "eşiğe kalan gün" ne olur?', a: 'Model doğrusal ve ekranda yazıyor. Isıl kaçış süper-doğrusaldır; o modda sayı <b>iyimserdir</b>, gerçek tarih daha erken olabilir. 21 günde 14 geçerli gün yoksa sayı verilmez (YETERSİZ_GEÇMİŞ). Nominal %90 aralığın simülasyondaki kapsaması %88–93.', ref: 'docs/04 §6.1' },
  { q: 'Neden Sparkplug B değil?', a: 'Sparkplug 3.0 DDATA için <b>QoS 0 zorunlu</b> kılar; dayanıklılığımız PUBACK ile ilerleyen store-and-forward filigranına dayanır. Doğum/vasiyet/monoton sıra numarası fikirlerini aldık, rozeti bıraktık.', ref: 'docs/01 §6' },
  { q: 'Gerçekten SMS gidiyor mu? WhatsApp?', a: 'GSM modem AT diyaloğu ve SMPP oturumu <b>simüle</b> edilir, transkript kaydedilir; gerçek kanaldan mesaj gitmedi. Mesaj gövdesi, UCS-2 bütçesi, onay kodu, merdiven ve fırtına tavanı kodlu ve testli. WhatsApp için bulut tarafı gerektiğinden yalnız "pano + seviye + onay kodu" çıkan bir DMZ aynalama servisi önerildi, kurulmadı.', ref: 'notify/escalation.py' },
  { q: 'Neden bulut yok? Ölçek için gerekmez mi?', a: 'Gerekçe kurumsal: şebeke topolojisi ve arıza geçmişi kritik altyapı verisi. Teknik olarak da gerekmiyor: 100 pano ≈ 18 GB disk, 1000 pano tek çekirdeğin dörtte biri. 500 GB NVMe 100 panoda 25 kat baş boşluğu bırakır.', ref: 'docs/01 §4–5' },

  { q: 'Sensör arızası sağlam bir bağlantıyı sıktırır mı?', a: 'Hayır. DEVICE_MOUNT_LOST, AIM_SHIFTED, DRIFT, STUCK, CELL_LOW <b>cihaz iş emri</b> üretir, pano iş emri asla. Kelepçe düşerse okunan sıcaklık havanınkidir; tork iş emri yapısal olarak engellenir.', ref: 'docs/05 §8.2' },
  { q: 'Nem ve yoğuşmayı nasıl izliyorsunuz?', a: 'Su havadan değil, çiy noktasının altındaki <b>yüzeyde</b> yoğuşur. Duvar sıcaklığını havanın τ ≈ 90 dk gecikmesi olarak modelliyoruz, pay = T_duvar − T_çiy. Boolean değil pay raporlanır. Tek başına İzle/Uyarı; yükselen PD ile birlikte Kritik.', ref: 'docs/04 §9.2' },
  { q: 'Ağ geçidi ile sunucu bağlantısı koparsa?', a: 'Üç yerel kural çalışmaya devam eder (≥ 90 °C, Δ ≥ 20 K, ark). 20 000 çerçeve halka tamponda tutulur, PUBACK geldikçe filigran ilerler; ark olayı tamponun başına alınır. Tampon dolarsa en eskiler düşer ve düşen sayısı bir sağlık metriği olarak yayınlanır.', ref: 'docs/01 §2.1' },
  { q: 'Maliyeti ne, ne zaman geri öder?', a: 'Modül donanımı €470,59 (1000 adet) / €660,91 (100 adet), kurulum €150. 100 pano tekdüze: 6,9 yıl (5 yılda −€30 166). Aynı 100 modül en kötü ondalıkta: <b>2,2 yıl</b>. 1000 pano tekdüze: 3,3 yıl. Faydanın %43,5\'i tespit oranından bağımsız (termografi ziyareti).', ref: 'docs/07' },

/* ======================================================================
   Sunum motoru — slayt, adım, animasyon tetikleme, konuşmacı ekranı, PDF baskısı.
   Bağımlılık yok; dosya çevrimdışı açılır.
   ====================================================================== */
(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEAKER = new URLSearchParams(location.search).has('speaker');
/* ?print: her slayt bir sayfa, tüm adımlar açık, sahneler son karede (build.py --pdf). */
const PRINT = new URLSearchParams(location.search).has('print');

const fmtCache = {};
function fmt(v, dec = 0) {
  const k = dec;
  fmtCache[k] = fmtCache[k] || new Intl.NumberFormat('tr-TR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return fmtCache[k].format(v).replace('-', '−');
}
window.fmt = fmt;

/* ---------------- sayaç ---------------- */
function countUp(n) {
  if (n._cu) return; n._cu = 1;
  const to = +n.dataset.count, dec = +(n.dataset.dec || 0), from = +(n.dataset.from || 0);
  const pre = n.dataset.pre || '', suf = n.dataset.suf || '';
  const put = v => { n.textContent = pre + (n.dataset.plain ? String(Math.round(v)) : fmt(v, dec)) + suf; };
  if (REDUCED || PRINT) { put(to); return; }
  const delay = parseFloat(getComputedStyle(n).getPropertyValue('--d')) || 0;
  const dur = (+(n.dataset.dur || 1.3)) * 1000;
  const t0 = performance.now() + delay * 1000;
  put(from);
  const tick = t => {
    const p = Math.min(1, Math.max(0, (t - t0) / dur));
    put(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1 && n.isConnected) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------------- animasyon kapsamı ---------------- */
function closedStep(n, root) {
  const st = n.closest('[data-step]');
  return st && root.contains(st) && !st.classList.contains('on');
}
function activate(scope, root) {
  const nodes = $$('[data-a],[data-count]', scope);
  if (scope.matches && scope.matches('[data-a],[data-count]')) nodes.push(scope);
  for (const n of nodes) {
    if (closedStep(n, root)) continue;
    if (n.hasAttribute('data-a')) n.classList.add('go');
    if (n.hasAttribute('data-count')) countUp(n);
  }
}
function deactivate(scope) {
  const nodes = $$('[data-a],[data-count]', scope);
  if (scope.matches('[data-a],[data-count]')) nodes.push(scope);
  for (const n of nodes) {
    n.classList.remove('go');
    if (n.hasAttribute('data-count')) { n._cu = 0; n.textContent = (n.dataset.pre || '') + fmt(+(n.dataset.from || 0), +(n.dataset.dec || 0)) + (n.dataset.suf || ''); }
  }
}

/* ---------------- slayt kabuğu ---------------- */
const MARK = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#4aa3ff" stroke-width="3"/><circle cx="16" cy="16" r="3.4" fill="#ffea46"/></svg>';
function chrome(s) {
  let h = '';
  if (!s.noCorner) h += `<div class="cnr"><img src="${A.adm}" alt="ADM Elektrik Dağıtım"><i></i><img src="${A.gdz}" alt="GDZ Elektrik Dağıtım"></div>`;
  if (!s.noFoot) h += `<div class="foot">${MARK}<span>PANO GÖZ${s.section ? ' · ' + s.section : ''}</span></div>`;
  h += '<div class="hint-next">→</div>';
  return h;
}
function renderInto(el, i) {
  const s = SL[i];
  const html = PRINT && s.printHtml ? s.printHtml : s.html;
  el.innerHTML = (typeof html === 'function' ? html() : html) + chrome(s)
    + (PRINT && i ? `<div class="pgno">${i + 1} / ${SL.length}</div>` : '');
  el.dataset.i = i;
  for (const p of el.querySelectorAll('[data-a="draw"]')) {
    try { if (p.getTotalLength) p.style.setProperty('--len', Math.ceil(p.getTotalLength() + 4)); } catch (e) { /* görünmeyen öğe */ }
  }
  return Math.max(0, ...$$('[data-step]', el).map(n => +n.dataset.step || 0));
}
function applyStep(el, n, maxStep, animate = true) {
  for (const st of $$('[data-step]', el)) {
    const k = +st.dataset.step;
    if (k <= n) {
      if (!st.classList.contains('on')) { st.classList.add('on'); if (animate) activate(st, el); }
    } else if (st.classList.contains('on')) { st.classList.remove('on'); deactivate(st); }
  }
  for (const d of $$('[data-dim-at]', el)) d.classList.toggle('dimmed', n >= +d.dataset.dimAt);
  for (const d of $$('[data-show-at]', el)) d.style.opacity = n >= +d.dataset.showAt ? '' : '0';
  el.classList.toggle('has-more', n < maxStep);
}
function startScene(el, i, step) {
  const s = SL[i];
  const still = REDUCED || PRINT;
  if (!s.scene || still && s.sceneNoReduced || PRINT && s.printHtml) return null;
  try { return s.scene(el, { step, fmt, A, REDUCED: still }) || null; } catch (e) { console.error('sahne', i, e); return null; }
}

/* ---------------- yayın kanalı (sunum ↔ konuşmacı) ---------------- */
let bc = null;
try { bc = new BroadcastChannel('panogoz-sunum'); } catch (e) { /* eski tarayıcı */ }
function post(msg) {
  try { bc && bc.postMessage(msg); } catch (e) {}
  try { localStorage.setItem('panogoz-sunum', JSON.stringify({ ...msg, _n: Math.random() })); } catch (e) {}
}
function onMsg(fn) {
  if (bc) bc.onmessage = e => fn(e.data);
  addEventListener('storage', e => { if (e.key === 'panogoz-sunum' && e.newValue) { try { fn(JSON.parse(e.newValue)); } catch (_) {} } });
}

/* ---------------- yardımcı paneller ---------------- */
function buildToc(goFn) {
  $('#tocl').innerHTML = SL.map((s, i) =>
    `<li data-i="${i}"><b>${i + 1}.</b><span>${s.title}</span><em>${s.time || ''}</em></li>`).join('');
  $$('#tocl li').forEach(li => li.onclick = () => { goFn(+li.dataset.i, 0); $('#toc').classList.remove('on'); });
}
function buildQa() {
  const render = q => {
    const t = (q || '').toLocaleLowerCase('tr');
    $('#qal').innerHTML = QA.filter(x => !t || (x.q + ' ' + x.a).toLocaleLowerCase('tr').includes(t))
      .map(x => `<div class="q"><h5>${x.q}</h5><p>${x.a}</p>${x.ref ? `<small>${x.ref}</small>` : ''}</div>`).join('')
      || '<p class="sub">Eşleşen soru yok.</p>';
  };
  render('');
  $('#qa input').oninput = e => render(e.target.value);
}
function printScript() {
  const w = window.open('', '_blank');
  if (!w) return;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const body = SL.map((s, i) => `
    <section><h2><span>${i + 1}</span> ${s.title}<em>${s.time || ''}</em></h2>
    <div class="t">${esc(s.notes || '')}</div>
    ${s.use ? `<div class="u">${s.use}</div>` : ''}</section>`).join('');
  w.document.write(`<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>PANO GÖZ · Konuşma metni</title>
  <style>body{font:15px/1.6 "Segoe UI",system-ui,sans-serif;color:#111;max-width:860px;margin:40px auto;padding:0 24px}
  h1{font-size:26px;margin:0 0 4px}p.s{color:#666;margin:0 0 28px}
  section{break-inside:avoid;border-top:1px solid #ddd;padding:16px 0}
  h2{font-size:18px;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}h2 span{color:#e06d00;font-family:Consolas,monospace}
  h2 em{margin-left:auto;font:500 12px Consolas,monospace;color:#888;font-style:normal}
  .t{white-space:pre-wrap}.u{margin-top:10px;padding:10px 12px;background:#f6f6f6;border-radius:8px;font-size:13.5px;color:#333}
  .u b{color:#b85200}</style></head><body><h1>PANO GÖZ · Final sunumu konuşma metni</h1>
  <p class="s">ADM & GDZ Elektrik · Grid Up Hackathon · ${SL.length} slayt</p>${body}
  <h2 style="margin-top:30px">Jüri soruları — hazır cevaplar</h2>
  ${QA.map(x => `<section><b>${x.q}</b><div>${x.a}</div></section>`).join('')}</body></html>`);
  w.document.close();
}

/* =====================================================================
   PDF BASKISI
   Slaytlar alt alta dizilir; her biri 1280×720 bir sayfadır (deck.css @page).
   Adımların hepsi açılır, sayaçlar son değerine, canlı sahneler REDUCED
   yoluyla son karelerine oturur. Slayt printHtml verirse o kullanılır.
   ===================================================================== */
if (PRINT) {
  document.documentElement.classList.add('print');
  const deck = $('#deck');
  SL.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide active static';
    deck.appendChild(el);
    const max = renderInto(el, i);
    applyStep(el, max, max, false);
    activate(el, el);
    const sc = startScene(el, i, max);
    if (sc && sc.step) sc.step(max);
    if (sc && sc.stop) sc.stop();
  });
  document.documentElement.dataset.ready = '1';
  return;
}

/* =====================================================================
   KONUŞMACI EKRANI
   ===================================================================== */
if (SPEAKER) {
  document.body.classList.add('speaker');
  document.title = 'Konuşmacı · ' + document.title;
  const box = $('#spk');
  let ci = -1, cs = 0, cmax = 0, scn = null, t0 = null, acc = 0, running = false;
  const curHost = $('#mcur'), nxtHost = $('#mnxt');
  const scale = () => {
    for (const h of [curHost, nxtHost]) {
      const p = h.parentElement; const s = Math.min(p.clientWidth / 1280, p.clientHeight / 720);
      h.style.transform = `scale(${s})`;
      h.style.left = ((p.clientWidth - 1280 * s) / 2) + 'px'; h.style.top = ((p.clientHeight - 720 * s) / 2) + 'px';
    }
  };
  const mk = host => { host.innerHTML = '<section class="slide active"></section>'; return host.firstChild; };
  function show(i, st) {
    i = Math.max(0, Math.min(SL.length - 1, i));
    if (i !== ci) {
      if (scn && scn.stop) scn.stop();
      const el = mk(curHost); cmax = renderInto(el, i); ci = i;
      requestAnimationFrame(() => { activate(el, el); scn = startScene(el, i, st); applyStep(el, st, cmax); scn && scn.step && scn.step(st); });
    } else {
      const el = curHost.firstChild; applyStep(el, st, cmax); scn && scn.step && scn.step(st);
    }
    cs = st < 0 ? cmax : st;
    // sıradaki
    const nx = mk(nxtHost); nx.parentElement.classList.add('static');
    if (cs < cmax) { const m = renderInto(nx, i); applyStep(nx, cs + 1, m, false); activate(nx, nx); $('#spk .nxt .lbl').textContent = `SIRADAKİ · ADIM ${cs + 1}/${cmax}`; }
    else if (i + 1 < SL.length) { const m = renderInto(nx, i + 1); applyStep(nx, m, m, false); activate(nx, nx); $('#spk .nxt .lbl').textContent = `SIRADAKİ · ${i + 2}. ${SL[i + 1].title}`; }
    else { nx.innerHTML = '<div class="center" style="height:100%;font:600 40px var(--sans);color:var(--dim)">Son</div>'; $('#spk .nxt .lbl').textContent = 'SIRADAKİ'; }
    $('#stxt').textContent = SL[i].notes || '';
    $('#suse').innerHTML = SL[i].use || '';
    $('#spk .ttl').textContent = `${i + 1}/${SL.length} · ${SL[i].title}`;
    $('#spk .steps').textContent = cmax ? `adım ${cs}/${cmax}` : '';
    $('#spk .tgt').textContent = SL[i].time ? 'hedef ' + SL[i].time : '';
    scale();
  }
  function nav(d) {
    let i = ci, st = cs;
    if (d > 0) { if (st < cmax) st++; else if (i < SL.length - 1) { i++; st = 0; } }
    else { if (st > 0) st--; else if (i > 0) { i--; st = -1; } }
    if (!running && t0 === null) startTimer();
    show(i, st); post({ t: 'go', i, step: st });
  }
  function startTimer() { running = true; t0 = performance.now(); }
  setInterval(() => {
    const now = new Date();
    $('#spk .clock').textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    const ms = acc + (running && t0 !== null ? performance.now() - t0 : 0);
    const s = Math.floor(ms / 1000);
    $('#spk .timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 250);
  $('#tstart').onclick = () => { if (running) { acc += performance.now() - t0; running = false; } else { t0 = performance.now(); running = true; } };
  $('#treset').onclick = () => { acc = 0; t0 = running ? performance.now() : null; };
  addEventListener('resize', scale);
  addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); nav(1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); nav(-1); }
  });
  onMsg(m => {
    if (!m || m.t !== 'state' || (m.i === ci && m.step === cs)) return;
    if (!running && t0 === null) startTimer();
    show(m.i, m.step);
  });
  const h = (parseInt(location.hash.slice(1)) || 1) - 1;
  show(h, 0);
  post({ t: 'hello' });
  return;
}

/* =====================================================================
   ANA SUNUM
   ===================================================================== */
const deck = $('#deck');
const slides = SL.map((s, i) => { const el = document.createElement('section'); el.className = 'slide'; el.dataset.i = i; deck.appendChild(el); return el; });
let cur = -1, step = 0, maxStep = 0, scene = null;

function setStep(n) {
  step = Math.max(0, Math.min(maxStep, n));
  applyStep(slides[cur], step, maxStep);
  scene && scene.step && scene.step(step);
  hud();
}
function go(i, st = 0) {
  i = Math.max(0, Math.min(SL.length - 1, i));
  if (i !== cur) {
    if (scene && scene.stop) scene.stop();
    scene = null;
    const prev = slides[cur];
    slides.forEach((el, j) => el.classList.toggle('active', j === i));
    if (prev) setTimeout(() => { if (!prev.classList.contains('active')) prev.innerHTML = ''; }, 450);
    cur = i;
    const el = slides[i];
    maxStep = renderInto(el, i);
    step = 0;
    const target = st < 0 ? maxStep : st;
    requestAnimationFrame(() => {
      if (cur !== i) return;
      activate(el, el);
      scene = startScene(el, i, target);
      setStep(target);
    });
  } else setStep(st < 0 ? maxStep : st);
  hud();
}
function hud() {
  $('#cur').textContent = cur + 1;
  $('#tot').textContent = SL.length;
  $('#bar').style.width = ((cur + 1) / SL.length * 100) + '%';
  const s = SL[cur];
  $('#nttl').textContent = `${cur + 1}. ${s.title}`;
  $('#ntime').textContent = (s.time ? '⏱ ' + s.time : '') + (maxStep ? ` · adım ${step}/${maxStep}` : '');
  $('#ntxt').textContent = s.notes || '';
  $('#nuse').innerHTML = s.use || '';
  $('#navp').disabled = cur === 0 && step === 0;
  $('#navn').disabled = cur === SL.length - 1 && step >= maxStep;
  $$('#tocl li').forEach(li => li.classList.toggle('cur', +li.dataset.i === cur));
  const h = '#' + (cur + 1);
  if (location.hash !== h) history.replaceState(null, '', h);
  post({ t: 'state', i: cur, step });
}
function next() { if (step < maxStep) setStep(step + 1); else if (cur < SL.length - 1) go(cur + 1, 0); }
function prev() { if (step > 0) setStep(step - 1); else if (cur > 0) go(cur - 1, -1); }

/* Slayt, iki yanda ok düğmeleri için boşluk bırakacak biçimde ölçeklenir; oklar bu
   boşluğun ortasına, sayaç slaytın altındaki boşluğa oturur. Hiçbiri slayta değmez. */
const NAV = 44, NAV_GAP = 16;
function fit() {
  const W = innerWidth, Hh = innerHeight;
  const side = NAV + 2 * NAV_GAP;
  const s = Math.max(.2, Math.min((W - 2 * side) / 1280, (Hh - 80) / 720));
  deck.style.transform = `scale(${s})`;
  const sw = 1280 * s, sh = 720 * s, gx = (W - sw) / 2, gy = (Hh - sh) / 2;
  const x = Math.max(6, (gx - NAV) / 2);
  $('#navp').style.left = x + 'px';
  $('#navn').style.right = x + 'px';
  const hudEl = $('#hud');
  hudEl.style.right = gx + 'px';
  hudEl.style.bottom = Math.max(4, (gy - 16) / 2) + 'px';
  const help = $('#help');
  help.style.left = gx + 'px';
  help.style.bottom = Math.max(4, (gy - 25) / 2) + 'px';
}
addEventListener('resize', fit);

/* kenar okları */
let navT = 0;
function navShow() { document.body.classList.add('navon'); clearTimeout(navT); navT = setTimeout(() => document.body.classList.remove('navon'), 1800); }
addEventListener('mousemove', navShow);
$('#navp').onclick = e => { e.stopPropagation(); prev(); };
$('#navn').onclick = e => { e.stopPropagation(); next(); };

const overlay = id => $(id).classList.contains('on');
function closeAll() { ['#notes', '#toc', '#qa'].forEach(id => $(id).classList.remove('on')); }
let numBuf = '', numT = 0;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { $('#qa').classList.remove('on'); e.target.blur(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape') { closeAll(); $('#black').classList.remove('on'); return; }
  if (/^[0-9]$/.test(k)) { numBuf += k; clearTimeout(numT); numT = setTimeout(() => numBuf = '', 1500); return; }
  if (k === 'Enter' && numBuf) { go(parseInt(numBuf, 10) - 1, 0); numBuf = ''; return; }
  if (['ArrowRight', ' ', 'PageDown', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') go(0, 0);
  else if (k === 'End') go(SL.length - 1, -1);
  else if (k === 'n' || k === 'N') $('#notes').classList.toggle('on');
  else if (k === 'o' || k === 'O') $('#toc').classList.toggle('on');
  else if (k === 'q' || k === 'Q') { $('#qa').classList.toggle('on'); if (overlay('#qa')) setTimeout(() => $('#qa input').focus(), 50); }
  else if (k === 's' || k === 'S') window.open(location.pathname + '?speaker#' + (cur + 1), 'panogoz-konusmaci', 'width=1400,height=860');
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'b' || k === 'B' || k === '.') $('#black').classList.toggle('on');
  else if (k === 'p' || k === 'P') printScript();
  else if (k === 'r' || k === 'R') { const c = cur; cur = -1; go(c, 0); }
  else if (k === '?' || k === 'h' || k === 'H') flashHelp();
});
addEventListener('click', e => {
  if (e.target.closest('.panel') || e.target.closest('.nav') || e.target.closest('#black')) return;
  if (e.target.closest('.slide')) return;
  e.clientX < innerWidth * 0.5 ? prev() : next();
});
$('#black').onclick = () => $('#black').classList.remove('on');
onMsg(m => {
  if (!m) return;
  if (m.t === 'go') { if (m.i !== cur) go(m.i, m.step); else setStep(m.step < 0 ? maxStep : m.step); }
  else if (m.t === 'hello') post({ t: 'state', i: cur, step });
});
function flashHelp() { const h = $('#help'); h.classList.add('on'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('on'), 4200); }

addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) go(n - 1, 0); });
/* prova ve otomatik kontrol için */
window.__deck = { go, next, prev, get cur() { return cur; }, get step() { return step; }, get maxStep() { return maxStep; }, count: SL.length };

buildToc(go);
buildQa();
fit();
go(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1), 0);
setTimeout(flashHelp, 700);
})();

</script>
