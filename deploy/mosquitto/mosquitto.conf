# PANO GÖZ — Mosquitto (on-prem). Sertleştirme notları: docs/13-DAGITIM-SERTLESTIRME.md
# Konu şeması ve ACL: panogoz/bus/topics.py, deploy/mosquitto/acl

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true

# ---- TEK dinleyici: karşılıklı TLS (düz metin 1883 YOK) ----
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
# Sunucu sertifikasını yalnız bu CA'nın imzaladığı, geçerli bir İSTEMCİ sertifikası olan cihaz görebilir.
require_certificate true
# Kullanıcı adı = istemci sertifikası CN'i -> ACL cihaz kimliğine bağlanır (parola yok, çalınacak parola yok).
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Kaynak sınırları (bir cihazın veya saldırganın brokerı boğmasını önler)
max_connections 512
max_packet_size 65536
message_size_limit 65536
max_inflight_messages 20
max_queued_messages 1000
