# PANO GÖZ — ters vekil (nginx-unprivileged, 8443). Konsol/API'yi TLS + operatör istemci sertifikasıyla korur.
# Sertleştirme notları: docs/13-DAGITIM-SERTLESTIRME.md

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    # istemci başına istek sınırı (kaba kuvvet / tarama)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ack:10m rate=2r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default close; }

    upstream panogoz_app { server panogoz:8080; keepalive 16; }

    # düz HTTP yok: 8080 dinlenmez. Yalnız TLS.
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /certs/proxy.crt;
        ssl_certificate_key /certs/proxy.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # operatör kimlik doğrulaması: CA'nın imzaladığı istemci sertifikası ZORUNLU
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        if ($request_method !~ ^(GET|POST|HEAD)$) { return 405; }

        # demo kontrol uçları üretimde DIŞARI açılmaz (uygulama da --no-demo-controls ile başlar)
        location /api/sim/ { return 403; }

        # onay/kapatma uçları daha sıkı hız sınırı
        location ~ ^/api/fleet/(alarms/[^/]+/(ack|close)|mute|silence)$ {
            limit_req zone=ack burst=5 nodelay;
            include /etc/nginx/proxy_common.conf;
            proxy_pass http://panogoz_app;
        }

        location / {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/proxy_common.conf;
            proxy_pass http://panogoz_app;
        }

        # sağlık: yalnız uygulama içi (orkestratör doğrudan uygulamayı yoklar)
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    }
}
